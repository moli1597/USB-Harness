<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="300" fill="url(#bar)"/>
  <!-- USB 图标 -->
  <g transform="translate(120, 150)">
    <rect x="0" y="-30" width="90" height="60" rx="10" fill="#2563EB"/>
    <rect x="78" y="-22" width="20" height="44" rx="6" fill="#2563EB"/>
    <rect x="30" y="-16" width="24" height="32" rx="6" fill="#ffffff"/>
    <rect x="52" y="-16" width="10" height="32" rx="3" fill="#bfdbfe"/>
  </g>
  <!-- 标题 -->
  <text x="240" y="128" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="700" fill="#1f2937">USB Harness</text>
  <text x="240" y="176" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="26" fill="#4b5563">即插即用的 U 盘 AI 助手 · deepseek-harness 便携式变体</text>
  <text x="240" y="216" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="18" fill="#6b7280">免安装 · 离线可用 · 适配中国网络 · Windows / Linux / macOS</text>
  <text x="240" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="16" fill="#9ca3af">基于 MIT License · 支持 OpenAI 兼容网关（Ollama / 阿里云百炼 / OpenRouter）</text>
</svg>
